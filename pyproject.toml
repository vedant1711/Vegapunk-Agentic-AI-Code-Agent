[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "agent*", "tools*", "llm*"]

[project]
name = "vegapunk"
version = "0.1.0"
description = "Vegapunk — An AI Coding Agent powered by 6 Satellites that autonomously resolves GitHub issues"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # --- FastAPI + Server ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # --- LangGraph + LangChain ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",

    # --- LLM Providers ---
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",

    # --- GitHub + Git ---
    "PyGithub>=2.4.0",
    "GitPython>=3.1.43",

    # --- Docker ---
    "docker>=7.1.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",

    # --- Utilities ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
