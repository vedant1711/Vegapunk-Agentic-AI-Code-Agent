[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "agent*", "tools*", "llm*", "mcp_server*"]

[project]
name = "vegapunk"
version = "0.1.0"
description = "Vegapunk - Autonomous Coding Agent. Resolves GitHub issues end-to-end by planning, writing code, running tests, self-reviewing, and opening a pull request."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # --- FastAPI + Server ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- LangGraph + LangChain ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",

    # --- LLM Providers ---
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",

    # --- GitHub + Git ---
    "PyGithub>=2.4.0",
    "GitPython>=3.1.43",

    # --- Docker ---
    "docker>=7.1.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",

    # --- Utilities ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.8.0",

    # --- Code intelligence (Phase 1) ---
    # Tree-sitter builds a language-agnostic symbol + reference graph
    # so retrieval doesn't fall back to regex scans on large repos.
    # Runtime is pinned to >=0.25 because rust grammar 0.23.3 uses ABI 15
    # which the earlier 0.23.x runtime cannot load.
    "tree-sitter>=0.25.0,<0.27",
    "tree-sitter-python>=0.23.6,<0.24",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-javascript>=0.23.1,<0.24",
    "tree-sitter-go>=0.23.4,<0.24",
    "tree-sitter-rust>=0.23.3,<0.24",
    "networkx>=3.3,<4",
    # NetworkX 3.x uses scipy for its default pagerank solver. Without it,
    # nx.pagerank silently degrades to a uniform prior which defeats the
    # point of the hybrid ranking.
    "scipy>=1.13,<2",

    # --- Model Context Protocol (Phase 3) ---
    # Exposes tools/* and the repo graph over MCP so external clients
    # (Claude Code / Cursor / Cline) can drive Vegapunk without any
    # custom SDK.
    "mcp>=1.2.0,<2",
]

[project.scripts]
# `pip install .` places this as a shell command so users can wire it
# into their MCP client config with a single argv entry.
vegapunk-mcp = "mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
# 120 is standard for modern Python projects and gives room for long
# prompt strings and JSON tool-definition dicts without ugly wrapping.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042 wants StrEnum (3.11+) instead of `class X(str, Enum)`. The mixed
# inheritance is intentional here for JSON serialization stability and
# comparison semantics; switching would change behavior subtly.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Tool-definition dicts naturally exceed line length in nested descriptions.
"tools/*.py" = ["E501"]
# Long system prompts and node docstrings in agent nodes.
"agent/nodes/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Skip fixture directories - they contain intentionally-named test_*.py
# files that are inputs to real tests, not tests themselves.
norecursedirs = ["fixtures", ".venv", "workspaces"]

[tool.coverage.run]
source = ["app", "agent", "tools", "llm"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
