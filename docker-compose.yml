# Vegapunk - Autonomous Coding Agent
#
# Local production-shaped stack: backend on :8000, frontend on :3000.
# Boots with `make demo` or `docker compose up --build`.
#
# For deployment on Render + Vercel see render.yaml and the "Deploy"
# section in README.md.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vegapunk-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      # Docker sandbox needs network for cloned repos to pip/npm install
      SANDBOX_ALLOW_NETWORK: "true"
    env_file:
      - .env
    volumes:
      # Persist cloned repos across container restarts
      - ./workspaces:/app/workspaces
      # Mount host Docker socket so the sandbox can spin up sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Compile-time API URL baked into the Next.js bundle.
        # Override for real deployments (e.g. https://api.example.com).
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: vegapunk-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - "http://localhost:3000/"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
